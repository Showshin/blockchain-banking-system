<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/seal.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f3" />
    <meta
      name="description"
      content="TÍCH — sổ tiết kiệm on-chain: mở sổ, theo dõi lãi và tất toán minh bạch."
    />
    <script>
      try {
        const storedTheme = localStorage.getItem('tich-theme-v1')
        const theme = storedTheme === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#0e100f' : '#f5f6f3')
      } catch {
        // The app falls back to the light theme.
      }
    </script>
    <title>TÍCH — Sổ tiết kiệm on-chain</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
